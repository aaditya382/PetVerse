<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetVerse | Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#d4fc79,#96e6a1);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            width:380px;
            background:#fff;
            border-radius:20px;
            padding:40px;
            box-shadow:0 15px 35px rgba(0,0,0,.2);
            text-align:center;
        }

        .logo{
            font-size:60px;
            margin-bottom:10px;
        }

        h1{
            color:#2E7D32;
            margin-bottom:10px;
        }

        p{
            color:#666;
            margin-bottom:30px;
        }

        .input-box{
            margin-bottom:20px;
            text-align:left;
        }

        .input-box label{
            font-weight:bold;
            color:#444;
        }

        .input-box input{
            width:100%;
            padding:12px;
            margin-top:8px;
            border:2px solid #ddd;
            border-radius:10px;
            font-size:15px;
            transition:.3s;
        }

        .input-box input:focus{
            border-color:#4CAF50;
            outline:none;
            box-shadow:0 0 10px rgba(76,175,80,.3);
        }

        .login-btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#4CAF50;
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }

        .login-btn:hover{
            background:#2E7D32;
            transform:translateY(-2px);
        }

        .links{
            margin-top:20px;
            font-size:15px;
        }

        .links a{
            color:#2E7D32;
            text-decoration:none;
            font-weight:bold;
        }

        .links a:hover{
            text-decoration:underline;
        }

        .footer{
            margin-top:25px;
            color:#888;
            font-size:13px;
        }
    </style>

</head>
<body>

<div class="login-box">

    <div class="logo">🐾</div>

    <h1>Welcome to PetVerse</h1>

    <p>Login to continue your pet care journey.</p>

    <form>

        <div class="input-box">
            <label>Email Address</label>
            <input type="email" placeholder="Enter your email">
        </div>

        <div class="input-box">
            <label>Password</label>
            <input type="password" placeholder="Enter your password">
        </div>

        <button class="login-btn" type="submit">
            Login
        </button>

    </form>

    <div class="links">
        Forgot Password? <a href="#">Click Here</a>
        <br><br>
        Don't have an account?
        <a href="#">Register Now</a>
    </div>

    <div class="footer">
        ❤️ PetVerse | Love • Care • Happiness
    </div>

</div>

</body>
</html>
